:root {

.tip-box p { font-size: 13px; margin: 0; color: #92400e; }

.quiz-opt.wrong { border-color: var(--red); background: #fef2f2; color: #991b1b; }

.quiz-feedback.show { display: block; }
.quiz-feedback.good { background: #ecfdf5; color: #065f46; }
.quiz-feedback.bad { background: #fef2f2; color: #991b1b; }

-14 岁）", "Tanner 4：阴茎增粗，喉结突出，腋毛出现（约 14-15 岁）", "Tanner 5：发育完成，达到成人形态（约 16-18 岁）"]}, {"h": "深入：遗精不是「满了才漏」那么简单", "body": "你可能听过「精囊满了会自动溢出」的说法，这只说对了一半。遗精的真正机制是：睡眠时（尤其 REM 期）副交感神经占主导，加上大脑对性反射的抑制减弱，加上睾酮水平在凌晨较高，几个因素叠加导致勃起和射精。它是身体在「测试」和「校准」生殖系统，跟做梦内容没有必然关系。", "tipLabel": "真相", "tip": "频率从几周一次到一周几次都属于正常范围。频繁遗精不会「伤身体」——这是老一辈的错误观念，精液的主要成分是水和少量蛋白质，不会「耗尽元气」。"}, {"h": "深入：勃起是神经血管事件", "body": "勃起不是「想」出来的，是副交感神经兴奋、动脉扩张、海绵体充血的结果。这意味着：", "list": ["晨勃是 REM 睡眠的副产品，跟做不做梦无关", "白天莫名其妙勃起是神经反射，不是你「思想有问题」", "紧张、害怕、甚至被老师叫起来回答问题都可能引起——交感和副交感神经的失衡会产生这种反应", "应对方法不是「压制」，而是分散注意力（想一道数学题、做心算），让交感神经重新占主导，几分钟就消退"]}, {"h": "深入：关于自慰", "body": "这件事爸爸之前可能没跟你细讲。医学和心理学共识是：青春期探索自己身体是正常的，不会导致失明、掉头发、记忆力下降——这些都是谣传。但有几条底线你需要清楚：", "list": ["必须在绝对私密的环境下（自己房间锁门），不能在公共场所", "不能依赖色情内容来刺激——色情内容对大脑多巴胺系统的影响是真实存在的（后面会讲）", "不影响正常生活、学习、社交为宜。如果成了逃避情绪的手段，那就要警惕", "注意卫生，事前事后洗手"], "tipLabel": "为什么讲这个", "tip": "不讲不等于不存在。你不从靠谱的渠道了解，就会从同学、网络、色情网站那里得到错误信息。爸爸宁可你从科学的角度知道真相。"}, {"h": "深入：几个容易被忽略的问题", "list": ["包皮：能轻松翻下来露出龟头就不需要手术；翻不下来或发炎反复，才考虑割包皮", "男性乳房发育：约一半男生青春期会出现暂时性胸部隆起，是激素波动造成的，1-2 年内会消退，不是「长奶」", "痤疮：雄激素刺激皮脂腺过度分泌，不是「洗脸不干净」造成的，严重的要看皮肤科", "睾丸大小不对称：轻微差异正常，但如果一侧明显肿大或摸到硬块，必须告诉爸爸去看医生"]}], "quizzes": [{"q": "同学 A 13 岁已经长喉结了，同学 B 还没变声。谁「更有问题」？", "opts": ["A 发育太早不正常", "B 发育太晚不正常", "都没问题，下丘脑启动时间由基因决定", "要看谁更高"], "answer": 2, "feedback": "Tanner 分期的时间窗很宽（9-14 岁开始都正常），差异是基因决定的生物学现象，跟健康、能力、成熟度无关。"}, {"q": "上课时突然勃起，最有效的应对是？", "opts": ["用力按住等它下去", "想一道复杂的数学题分散注意力", "立刻去厕所处理", "深呼吸憋气"], "answer": 1, "feedback": "勃起由副交感神经主导。让大脑切换到需要专注的理性任务（心算、回忆课文），能激活交感神经，几分钟后自然消退。"}, {"q": "下面哪个说法是错的？", "opts": ["晨勃跟做梦内容无关", "频繁遗精不会「伤元气」", "自慰会导致记忆力下降", "男性青春期也可能出现胸部发育"], "answer": 2, "feedback": "「自慰伤身」是没有科学依据的旧观念。医学共识是：这是正常的生理探索，关键在于隐私、卫生和不影响生活。"}]}, {"id": 1, "icon": "👩", "color": "#fce7f3", "title": "女生的身体也在变化", "subtitle": "从了解月经到理解激素周期——为了尊重，也为了科学", "sections": [{"h": "基础：女生的青春期", "body": "和男生一样，女生也会经历青春期，只是变化的内容不同。了解这些变化，不是出于好奇，而是让你懂得尊重和理解身边的女生。", "list": ["胸部开始发育", "身高快速增长（通常比男生早 1-2 年）", "开始来月经", "长腋毛和阴毛", "皮肤变油，可能长痘", "骨盆变宽"]}, {"h": "基础：月经是什么", "body": "月经是女生子宫内膜定期脱落、伴随出血的生理现象，大约每个月来一次，每次持续 3-7 天。这是女性身体正常的生理循环，不是生病，不是「脏」，更不是什么丢人的事。", "tipLabel": "重要", "tip": "绝对不能拿女生的月经开玩笑。嘲笑女生来月经，跟嘲笑别人吃饭一样荒唐。"}, {"h": "基础：认识女生的身体结构", "body": "了解女生外生殖器的结构，是为了科学地认识人体。女生外生殖器也叫外阴，跟男生一样，这是基本常识。", "svg": "<img src=\"img/female_external.jpg\" alt=\"女性外生殖器结构（教科书医学插画）\" style=\"width:100%;max-width:420px;margin:0 auto;display:block;border-radius:12px;\">\n<div class=\"diagram-caption\">\n  <p style=\"margin-bottom:6px;\"><strong>图中英文标注对照：</strong>Prepuce=阴蒂包皮；Glans clitoris=阴蒂头；Labia minora=小阴唇；Labia majora=大阴唇；Urethral opening=尿道口；Vaginal opening=阴道口；Anus=肛门</p>\n  <p>图片来源：OpenStax Anatomy &amp; Physiology（教科书医学插画），CC BY 4.0 授权。</p>\n</div>", "list": ["阴阜：下腹下方隆起的脂肪垫，青春期开始长阴毛", "大阴唇：外侧两片较厚的皮肤皱褶，保护内部结构", "小阴唇：大阴唇内侧较薄的皮肤，富有神经末梢", "阴蒂：上方的小凸起，是女生最敏感的区域（与男性龟头同源）", "尿道口：阴蒂下方的小开口，排尿的出口", "阴道口：尿道口下方较大的开口，月经血排出和分娩的通道", "会阴：阴道口与肛门之间的区域"], "tipLabel": "记住", "tip": "尿道口和阴道口是两个不同的开口，很多人搞混。每个人的外阴外观都有差异，形状、颜色、大小各不相同，就像每个人的脸不一样，这都是正常的。"}, {"h": "基础：遇到女生经期不适", "list": ["有些女生来月经时肚子会疼、容易累，这是正常的", "不要嘲笑、起哄，更不要说「她来那个了」来取笑", "女生需要去厕所换卫生巾，这跟你去上厕所一样正常", "如果同学不舒服，递杯热水或者帮忙跟老师说一声就好", "不翻看女生的书包或物品找卫生用品"]}, {"h": "深入：月经周期是一场激素交响乐", "body": "女生的月经周期大约 28 天（21-35 天都算正常），由四种激素接力调控：", "list": ["第 1-5 天（月经期）：上次没受精的子宫内膜脱落，伴随出血", "第 6-13 天（卵泡期）：垂体分泌 FSH，卵泡发育，雌激素逐渐升高，子宫内膜重新增厚", "第 14 天左右（排卵）：雌激素达到峰值，触发 LH 峰，卵子排出", "第 15-28 天（黄体期）：黄体分泌孕酮，维持内膜。如果没怀孕，黄体萎缩，激素骤降，新一轮月经开始"]}, {"h": "深入：为什么男生要懂这些", "body": "不是为了「了解女生」，是因为：", "list": ["激素波动会真实影响女生的情绪、精力、甚至痛感阈值——这不是「矫情」，是生理", "经前综合征（PMS）是激素骤降引起的，严重的形式叫 PMDD，会出现明显抑郁和易怒", "排卵期附近女生受孕概率最高，这是避孕知识的基础", "月经周期规律是女性健康的重要指标，不规律可能是疾病信号"]}, {"h": "深入：痛经不只是「肚子疼」", "body": "痛经分两种：原发性（前列腺素导致子宫收缩，通常月经来潮第一天最重）和继发性（由子宫内膜异位症等疾病引起，可能越来越重）。严重的痛经不是「忍忍就好」，是需要就医的医学问题。", "tipLabel": "你能做的", "tip": "不嘲笑、不传播「她来那个了」。如果同桌不舒服，递杯热水、帮忙跟老师说一声，比任何调侃都有用。"}, {"h": "深入：HPV 疫苗——男生也该知道", "body": "HPV（人乳头瘤病毒）不仅导致宫颈癌，也导致尖锐湿疣、阴茎癌、口咽癌。HPV 疫苗不只女生能打，男生接种同样有意义——既保护自己，也减少传播。", "list": ["9 价疫苗覆盖最广，9-15 岁是最佳接种年龄（before 性接触）", "国内男性接种政策在逐步放开，可以问爸爸了解最新情况", "疫苗预防感染，但不能治已经感染的，所以越早打越好"]}, {"h": "深入：打破几个迷思", "list": ["「月经血是脏的」——错，它是子宫内膜组织和血液，跟其他血一样", "「来月经不能运动」——错，适度运动反而缓解痛经", "「女生来月经说明成熟了可以怀孕」——错，月经初潮后前几年周期往往不规律，不代表能健康生育", "「痛经结婚了就好」——毫无科学依据，是民间误传"]}], "quizzes": [{"q": "女同学这几天特别容易发脾气，可能的原因是？", "opts": ["她性格不好", "经前激素骤降（PMS）影响情绪", "她在故意针对你", "因为她讨厌你"], "answer": 1, "feedback": "PMS 是激素骤降引起的真实生理反应。理解这一点不是要你「忍让」，而是不要把激素驱动的情绪当成针对你个人。"}, {"q": "关于 HPV 疫苗，下面哪个对？", "opts": ["只有女生需要打", "男生也可以打，既保护自己也减少传播", "已经有性生活就不用打了", "打一针就终身免疫"], "answer": 1, "feedback": "HPV 不仅导致宫颈癌，也导致男性相关癌症和尖锐湿疣。9-15 岁是最佳接种窗口，男生同样受益。"}, {"q": "女生痛经很严重，应该？", "opts": ["让她忍忍，正常现象", "建议她看医生，严重痛经可能是疾病信号", "喝点热水就好了", "运动一下就不疼了"], "answer": 1, "feedback": "轻度痛经是正常的，但严重影响生活的痛经（尤其越来越重）可能是子宫内膜异位症等疾病，需要就医。"}]}, {"id": 2, "icon": "🧐", "color": "#e0e7ff", "title": "我的情绪和心理", "subtitle": "从「为什么烦躁」到大脑神经科学——理解你自己的内心", "sections": [{"h": "基础：为什么情绪像过山车", "body": "青春期身体会产生大量激素，这些激素不仅让你的身体变化，也会直接影响你的情绪。你可能突然烦躁、突然低落、突然容易发脾气——这不是你变坏了，是你的身体正在调整。"}, {"h": "基础：这些感受都正常", "list": ["突然觉得烦躁，看什么都不顺眼", "有时候莫名其妙想一个人待着", "对某些人产生好感（男生或女生都可以）", "觉得父母很烦，不想听他们说话", "有时候觉得自己很孤独，没人理解", "对未来的事情感到焦虑或迷茫"]}, {"h": "基础：喜欢一个人", "body": "在这个年纪，你可能开始对某个人产生好感，这是非常正常的。不管是喜欢女生还是男生，都不用觉得自己不正常。但记住，喜欢一个人不代表你要做什么，感受这份心情就好。", "tipLabel": "提醒", "tip": "如果情绪低落、什么都不想做、觉得生活没意思的状态持续超过两周，一定要告诉爸爸或者你信任的大人。这不是矫情，是需要帮助。"}, {"h": "基础：怎么处理情绪", "list": ["运动是很好的发泄方式——跑步、打球、骑车都行", "写日记或者画画，把情绪表达出来", "找个安静的地方待一会，给自己空间", "跟好朋友聊聊，你会发现大家都有类似的烦恼", "实在扛不住的时候，找大人帮忙不是丢脸的事"]}, {"h": "深入：你的大脑正在「施工」", "body": "青春期大脑有个关键不对称：负责情绪和奖赏的边缘系统（杏仁核、伏隔核）已经发育成熟，但负责理性决策、冲动控制、预判后果的前额叶皮质要等到 25 岁左右才完全成熟。这就是为什么你会：", "list": ["明知道不该做却还是做了（情绪系统压倒理性系统）", "对刺激和新鲜感特别渴望（多巴胺系统敏感度处于人生峰值）", "对同伴评价异常敏感（社交奖赏回路被放大）", "短期回报比长期后果更有吸引力"], "tipLabel": "不是你的错", "tip": "这是所有青少年共有的神经发育特征，不是「叛逆」或「性格问题」。但理解它，是为了不被它牵着走——下次冲动前停 3 秒，问自己「如果这事被爸妈知道、被老师知道、5 年后回看，我还会做吗？」"}, {"h": "深入：多巴胺——你为什么停不下来刷手机", "body": "多巴胺不是「快乐分子」，是「渴望分子」——它驱动你去追求，而不是让你满足。短视频、游戏、社交媒体都被设计成持续触发多巴胺释放的回路，跟赌博机的机制一样。", "list": ["刷 1 小时短视频 = 不断触发多巴胺，但每次释放量递减，所以越刷越空虚", "色情内容的多巴胺冲击更强，长期观看会让现实刺激「不够用」（脱敏）", "青春期大脑对多巴胺的敏感度是成人的 2 倍，所以你比爸妈更容易上瘾", "戒断反应（焦虑、烦躁、空虚）是真实的，不是「自制力差」"]}, {"h": "深入：性幻想是正常的", "body": "这个年纪出现性幻想（包括对认识的人、虚构角色、甚至模糊场景）是完全正常的心理现象，不代表你「思想龌龊」或「对某人不敬」。幻想是大脑在处理新出现的性冲动，跟实际行动是两回事。", "tipLabel": "但要分清", "tip": "幻想不等于行动权。你可以想，但不可以因此去骚扰、偷拍、或者纠缠对方。幻想是私密的，行动有边界。"}, {"h": "深入：抑郁和「心情不好」不是一回事", "body": "青春期情绪波动正常，但下面这些信号如果持续两周以上，就不是「心情不好」，而是需要专业帮助的抑郁倾向：", "list": ["持续低落、空虚，对原本喜欢的事完全提不起兴趣", "睡眠出问题（失眠或嗜睡）", "食欲明显变化（暴食或吃不下）", "觉得自己是负担，反复出现「死了算了」的念头", "注意力严重下降，成绩明显下滑", "莫名身体疼痛（头痛、肚子痛）查不出原因"], "tipLabel": "重要", "tip": "抑郁不是「矫情」或「脆弱」，是大脑神经递质失衡的医学问题，跟感冒一样需要治。告诉爸爸，或打 12355，这不是软弱，是聪明。"}, {"h": "深入：关于「我是谁」", "body": "青春期是自我认同形成的关键期。你会开始问「我到底是什么样的人」「我想要什么」「我跟别人有什么不同」——这些困惑是这个阶段的核心任务，不是「想太多」。不必急着给自己贴标签，身份是慢慢长出来的。"}], "quizzes": [{"q": "你明知道熬夜打游戏明天会困，但还是打到凌晨 3 点。最准确的解释是？", "opts": ["我意志力太差", "青春期前额叶没发育完全，情绪奖赏系统压倒了理性控制", "游戏太好玩了", "我不够成熟"], "answer": 1, "feedback": "这是神经发育的正常特征。理解它不是为了开脱，而是为了设计对策：把手机放客厅、设屏幕时间限制，用环境帮前额叶「兜底」。"}, {"q": "连续两周觉得什么都没意思、睡不着、成绩下滑，应该？", "opts": ["扛一扛就过去了", "告诉爸爸或打 12355，可能是抑郁倾向需要专业帮助", "多运动就好了", "是青春期正常现象不用管"], "answer": 1, "feedback": "持续两周以上的这些症状是抑郁倾向的医学信号，不是「心情不好」。抑郁是可治疗的医学问题，越早干预越好。"}, {"q": "对某个同学产生了性幻想，这说明？", "opts": ["我不尊重对方", "我思想有问题", "这是青春期正常的心理现象，跟行动是两回事", "我应该表白"], "answer": 2, "feedback": "性幻想是这个阶段大脑处理性冲动的正常方式。幻想私密、行动有边界——不可以因此去骚扰或纠缠对方。"}]}, {"id": 3, "icon": "🛡️", "color": "#d1fae5", "title": "身体边界与同意", "subtitle": "从「内衣区域」到权力、操控和模糊地带", "sections": [{"h": "基础：什么是隐私部位", "body": "内衣覆盖的区域——胸部、臀部、生殖器区域——都是你的隐私部位。这些地方只有你自己可以决定让不让别人看或碰。同样，别人的隐私部位你也不能看、不能碰。"}, {"h": "基础：「同意」是什么意思", "body": "任何涉及身体接触的事情，都必须双方都自愿同意。也就是说：", "list": ["别人想抱你，你不想，可以说「不」", "你不想跟人握手，可以拒绝", "即使对方是长辈、老师、亲戚，你也有权拒绝", "「不」就是「不」，不需要给理由", "别人说了「不」，你也要尊重，不能勉强"]}, {"h": "基础：熟人也可能不安全", "tipLabel": "重要", "tip": "研究表明，对未成年人实施性侵害的人，大多数是受害者认识的人——亲戚、邻居、老师、同学的家长……不要因为「认识」就放松警惕。任何人让你感到不舒服的触碰，都要拒绝。"}, {"h": "基础：遇到不舒服的接触怎么办", "list": ["大声说「不要碰我」「我不喜欢这样」", "立刻离开，去人多的地方", "第一时间告诉爸爸或者你信任的大人", "即使对方说「这是秘密」「不要告诉别人」，也要说", "不是你的错，永远不是你的错"]}, {"h": "深入：真正有效的同意有四个要素", "body": "很多人以为「对方没说不」就是同意，错。有效的同意必须同时满足：", "list": ["知情：知道即将发生什么，没有隐瞒和欺骗", "自愿：没有任何形式的威胁、利诱、压力", "清醒：没喝酒、没被下药、没睡着、意识清楚", "可撤回：任何时候都可以喊停，停了就必须立刻停"], "tipLabel": "关键", "tip": "缺少任何一条都不算同意。比如对方喝了酒说的「好」，不算同意。比如对方开始答应了中途说「不要」，继续就是性侵。"}, {"h": "深入：权力不对等时，「自愿」是假的", "body": "当一方对另一方有权力、有恩情、有权威时，「自愿」很难成立。这些关系里发生的性接触，即使表面「双方同意」，本质仍然是侵害：", "list": ["老师对学生（即使你 16 岁以上）", "教练对队员", "亲戚、长辈对晚辈", "老板、上司对下属", "任何「我帮你 X，你给我 Y」的交易式要求"], "tipLabel": "为什么", "tip": "权力不对等时，拒绝的代价太高（被穿小鞋、被传闲话、失去机会），所以「答应」往往是迫不得已，不是真自愿。法律和伦理都认定这类关系中的「同意」无效。"}, {"h": "深入：Grooming（诱导）的套路", "body": "侵害者很少直接动手，他们会花几周甚至几个月「培养」你。识别这些信号：", "list": ["对你异常好——送礼物、特殊对待、单独相处，建立「特别」关系", "试探边界——开始是「无意」的肢体接触（拍肩、摸头），慢慢升级", "制造秘密——「这事只在我们之间」「别人不会理解」", "孤立你——挑拨你跟父母朋友的关系，让你觉得只有他/她懂你", "测试保密——先让你做点小错事并保密，看你能不能守住「秘密」", "最后下手——等你信任他/她、又被抓住了把柄，侵害就发生了"]}, {"h": "深入：情感操控（Gaslighting）", "body": "侵害者常用的心理操控：让你怀疑自己的判断、觉得「是我记错了」「是我误会了」「是我自找的」。常见话术：", "list": ["「我没碰你，你想多了」", "「是你先穿成那样的」", "「你当时没拒绝，现在说不要脸不脸？」", "「说出去也没人信你，我可是 XX」", "「你要是说出去，你爸妈会怎么看你？」"], "tipLabel": "记住", "tip": "这些都是操控话术，不是事实。你的感受是真的，你的记忆是真的。任何让你身体不适的接触，不管对方怎么辩解，都是错的。"}, {"h": "深入：法律对男童的保护（重要）", "body": "很多人以为「男生不会被性侵」，错。中国法律对未成年男性的保护是这样的：", "list": ["不满 14 岁：任何人对你发生性接触，构成猥亵儿童罪（不论男女施害者）", "14-18 岁：使用暴力、胁迫或其他方法对你实施猥亵，构成强制猥亵罪", "注意：中国强奸罪条款目前主要保护女性，但猥亵犯罪已不限性别（2015 年修法）", "男性被性侵是真实存在的，报告率极低是因为羞耻和误解，不是没发生"], "tipLabel": "打破沉默", "tip": "如果你被男性或女性、熟人或陌生人、长辈或同龄人性侵害，不管你几岁，都不是你的错。男性受害者不需要「坚强」，需要的是被相信和被帮助。"}, {"h": "深入：数字时代的同意", "body": "拍照、录像、传播，每一步都需要单独同意。对方同意发生关系，不等于同意拍照；同意拍照，不等于同意传播。", "list": ["偷拍（包括偷拍同学、偷拍裙底）是违法的，可能构成侮辱罪或侵犯公民个人信息罪", "前任分手后传播亲密照片或视频，构成犯罪", "即使对方主动发了照片给你，你也不能转发给任何人"]}], "quizzes": [{"q": "聚会上一个学姐给你倒了酒，你喝了几杯之后她提议去她房间。这种情况下的「同意」？", "opts": ["只要你点头就算同意", "无效，你喝了酒不具备清醒同意的能力", "看她是不是真心喜欢你", "只要你们都未成年就行"], "answer": 1, "feedback": "酒精会削弱判断力和反抗能力，饮酒后的「同意」在法律和伦理上都不成立。清醒的同意才是同意。"}, {"q": "篮球教练单独给你「加练」，训练后总说「咱们之间的事别说出去」。你应该？", "opts": ["教练是好意，保密", "这是 grooming 信号，告诉爸妈", "看教练有没有真的做坏事再说", "先观察一段时间"], "answer": 1, "feedback": "「单独相处 + 制造秘密」是 grooming 的经典套路。不需要等到侵害发生才行动——这个信号本身就值得警觉并告诉爸妈。"}, {"q": "前任在朋友圈发了一张你之前发给他的私密照，你应该？", "opts": ["忍 关系变得「不够刺激」", "扭曲认知：色情里的性是表演——夸张的器官、不真实的反应、不尊重的互动，跟真实关系完全不同", "形成习惯回路：越看越需要更刺激的内容才能兴奋，跟成瘾机制一样", "影响现实关系：把伴侣当「角色」，而不是人"], "tipLabel": "如果已经看了", "tip": "不要自责，但要知道它在影响你。减少频率、别把它当「学习资料」、跟现实的人建立真实关系，是大脑恢复敏感度的方式。"}, {"h": "深入：勒索——常见的几种套路", "list": ["「我录了你裸聊的视频，给我转账不然发给你通讯录所有人」——绝大多数是诈骗，即使你给了钱对方也不会删。不要付，立刻告诉爸妈报警", "前任用旧照威胁复合或要钱——这是犯罪，保留聊天记录报警", "网友「帮你」充值、买皮肤换照片——这是交易式诱导，对方不会停", "收到「你爸出车祸了打钱」——电话核实，不要慌"]}, {"h": "深入：个人信息保护清单", "list": ["真实姓名、学校、班级、家庭住址——一律不告诉网友", "能看出脸和位置的照片（校服、小区门口、地标）——不发", "父母工作单位、电话——不发", "社交账号不要用真名，不要关联手机号", "不同平台用不同密码，开启两步验证"]}], "quizzes": [{"q": "游戏里认识一个月的「14 岁女生」问你要一张自拍，理由是「想看看你」。你应该？", "opts": ["拍一张，反正是网友", "拒绝，截图，告诉爸妈——这是 grooming 信号", "先看看她照片再决定", "戴墨镜拍一张就行"], "answer": 1, "feedback": "「14 岁女生」可能是个 40 岁男人。要照片是 grooming 第二阶段。宁可错杀，不要冒险。"}, {"q": "有人发消息说「我录了你裸聊的视频，转 5000 块不然发给你同学」，你该怎么办？", "opts": ["转账了事", "不转账，立刻告诉爸妈报警，对方大概率是群发诈骗", "讨价还价", "装看不见"], "answer": 1, "feedback": "这种勒索绝大多数是群发诈骗，即使你付了钱对方也不会停，反而确认你是「目标」。正确做法是告诉爸妈、报警、不付钱。"}, {"q": "下面哪个对色情内容的说法是准确的？", "opts": ["是学习性知识的好资料", "对大脑多巴胺系统有真实影响，会扭曲对真实关系的认知", "看了会上瘾一辈子", "完全无害"], "answer": 1, "feedback": "色情内容是表演，不是教育资料。长期观看会脱敏大脑奖赏系统，扭曲对真实亲密关系的认知。不是「禁止」，而是知道它在影响你。"}]}, {"id": 5, "icon": "⚖️", "color": "#f3f4f6", "title": "性行为与责任", "subtitle": "从基本概念到法律框架、避孕原理和性传播疾病", "sections": [{"h": "基础：什么是性行为", "body": "你现在可能对性有一些模糊的好奇，这很正常。性行为是成年人之间表达亲密关系的一种方式，但它涉及到身体、情感、法律和责任，不是一件可以随随便便的事。"}, {"h": "基础：法律怎么说", "tipLabel": "必须知道", "tip": "中国法律规定：与不满 14 周岁的未成年人发生性行为，无论对方是否自愿，都构成强奸罪。也就是说，14 岁以下的人没有法律上的性同意能力。即使双方都是未成年人，也不行。"}, {"h": "基础：避孕和防病", "body": "到了合适的年龄，性行为需要做好两件事：", "list": ["避孕——避免意外怀孕。避孕套是最常用的方式", "防病——预防性传播疾病（梅毒、淋病、HPV、HIV 等）", "避孕套同时能避孕和防病，是最基本的安全措施", "不戴避孕套 = 不负责任"]}, {"h": "基础：「准备好了」是什么意思", "body": "很多人以为身体发育了就「准备好了」，其实不是。真正的准备好意味着：", "list": ["能承担可能产生的后果（怀孕、疾病、情感伤害）", "能对自己和对方负责", "双方都完全自愿，没有任何强迫或诱导", "具备基本的健康知识", "到这个年纪，你现在远远还没准备好——这是正常的"]}, {"h": "深入：中国法律的完整框架（男生版）", "body": "你可能只知道「14 岁」这个数字，但法律对未成年人的保护更细：", "list": ["奸淫不满 14 岁的幼女：无论是否自愿，构成强奸罪，从重处罚", "猥亵儿童罪：对不满 14 岁的儿童（男女都算）实施猥亵，处 5 年以下；情节严重的最高 15 年", "强制猥亵罪：对 14 岁以上的人（男女都算）使用暴力、胁迫猥亵，处 5 年以下；情节严重的最高 15 年", "注意：作为男生，14 岁以下被任何人性接触都是犯罪；14-18 岁被强迫也是犯罪", "传播淫秽物品罪：制作、复制、出版、贩卖、传播淫秽物品——包括转发同学的私密照"]}, {"h": "深入：避孕方法的真实失败率", "body": "如果未来到了合适的年龄，避孕方法是必须了解的。注意「完美使用」和「典型使用」失败率差距很大——人不是机器：", "list": ["避孕套：完美使用 2%/年，典型使用 13%/年（戴反、漏戴、中途戴都算）", "短效避孕药：完美 0.3%，典型 7%（必须每天定时吃）", "紧急避孕药：单次 1-2% 失败率，激素剂量大，不能当常规方法用，伤害身体", "安全期法：典型 24%——基本等于不避孕", "体外射精：典型 22%——基本等于不避孕"], "tipLabel": "底线", "tip": "避孕套是唯一能同时避孕和防性病的，所以它是默认选项，没有商量余地。其他方法都是补充，不是替代。"}, {"h": "深入：性传播疾病——很多没有症状", "body": "STD 不是「看得出」的，很多人感染了完全没症状，但能传染给别人：", "list": ["HPV：大部分感染者无症状，部分型别导致宫颈癌、尖锐湿疣、口咽癌。疫苗可预防", "衣原体：70% 女性、50% 男性无症状，但会导致不孕。抗生素可治", "淋病：男性通常有症状（尿道流脓），女性常无症状", "梅毒：分多期，初期溃疡不痛，容易被忽略，晚期破坏神经和器官", "HIV：终身治疗，无法根治。但现代药物能让感染者寿命接近正常人", "疱疹：无法根治，反复发作"], "tipLabel": "为什么讲这个", "tip": "不是吓你，是让你明白「看不出来」不等于「没问题」。这是为什么避孕套加上减少性伴侣数量加上定期检查，是性健康的三大支柱。"}, {"h": "深入：「准备好了」到底是什么", "body": "生理发育不等于心理准备好。真正的准备好，需要同时具备：", "list": ["能承担后果：如果对方怀孕、感染疾病、关系破裂，你能负责吗？", "能拒绝也能接受拒绝：不会因为对方说不就崩溃，也不会强迫对方", "能沟通：能跟对方谈避孕、谈健康史、谈边界——做不到这点就不算准备好", "法律层面：14 岁以下任何情况都不行；14-16 岁有特殊保护；18 岁才是完全行为能力人", "情感层面：是真亲密关系，还是 peer pressure、好奇、想证明自己？"], "tipLabel": "实话", "tip": "12 岁半的你，远远没准备好——这是正常的。准备好不是年龄到了就行，是上面这些条件都成熟才行。"}, {"h": "深入：色情内容不等于真实的性", "body": "色情内容的几个严重失真：", "list": ["器官被夸张——通过选角和角度制造「标准」，绝大多数人不长那样", "反应被表演——演员的呻吟、表情是表演，不代表真实感受", "缺少最关键的部分——沟通、关心、尊重、安全措施，全都没有", "把人当物品——尤其女性被物化，跟真实关系完全相反", "传递错误观念——「不要就是要」「女性都喜欢粗暴」——这些是危险的谎言"]}], "quizzes": [{"q": "你 13 岁，一个 16 岁的姐姐说「我们试试，反正你自愿」。法律上？", "opts": ["双方自愿就行", "构成猥亵儿童罪，你不满 14 岁没有性同意能力", "看是不是真的自愿", "因为是姐姐所以不算"], "answer": 1, "feedback": "不满 14 岁的人在法律上没有性同意能力。即使表面「自愿」，对方也构成猥亵儿童罪。这是为了保护你这个年龄段的人。"}, {"q": "下面哪个避孕方法失败率最高？", "opts": ["避孕套（典型使用）", "短效避孕药（典型使用）", "安全期法", "紧急避孕药"], "answer": 2, "feedback": "安全期法典型失败率 24%，基本等于不避孕。原因是排卵时间受情绪、压力、疾病影响很大，预测不准。"}, {"q": "下面哪个关于 STD 的说法是对的？", "opts": ["看得出谁有病", "很多 STD 感染者完全没有症状", "只有性工作者才会得", "戴避孕套就 100% 不会感染"], "answer": 1, "feedback": "HPV、衣原体、淋病（女性）等很多 STD 没有症状，但能传染。看不出来不等于没问题。避孕套能大幅降低风险，但不是 100%。"}]}, {"id": 6, "icon": "🤝", "color": "#fef3c7", "title": "尊重与平等", "subtitle": "从「不嘲笑」到刻板印象、有毒男子气概和旁观者效应", "sections": [{"h": "基础：不拿身体开玩笑", "body": "每个人发育的速度不同，有人早有人晚。拿别人的身体特征开玩笑——胖瘦、高矮、胸部大小、有没有长毛、发育早晚——是非常恶劣的行为。", "list": ["你不想被别人嘲笑的事，也不要嘲笑别人", "「开玩笑」不能成为伤害别人的借口", "如果别人因为你某个身体特征嘲笑你，告诉他们停下来", "看到别人被嘲笑，不要跟着起哄"]}, {"h": "基础：不传八卦", "tipLabel": "想一想", "tip": "「谁喜欢谁」「谁和谁在一起了」这类八卦传播起来很快，但伤害也很大。你不会希望自己的私事被全班讨论，所以也不要参与传播别人的。"}, {"h": "基础：性别平等", "body": "没有「男生就该怎样」「女生就该怎样」。", "list": ["男生可以哭，可以温柔，可以喜欢做饭和艺术", "女生可以勇敢，可以好强，可以喜欢机械和编程", "「娘娘腔」「男人婆」这类称呼是侮辱，不是玩笑", "一个人的价值不由性别决定，由行为和品格决定"]}, {"h": "基础：尊重不同", "body": "世界上有各种各样的人。有些人的性取向跟大多数人不同，有些人的性别认同跟出生时的生理性别不同。这些都不是病，不是错，不需要被纠正，更不应该被欺负。", "tipLabel": "底线", "tip": "不欺负任何人，不管对方跟你有什么不同。如果你看到有人被欺负，至少做到不当旁观者——告诉老师。"}, {"h": "深入：性别刻板印象是怎么来的", "body": "「男生应该勇敢」「女生应该温柔」——这些不是天生的，是社会训练的结果。神经科学研究显示：男女大脑的差异远小于个体差异，大部分「性别特质」是后天塑造的。", "list": ["玩具的选择、衣服的颜色、说话的方式——从出生开始就被引导", "男生哭被说「没出息」，女生好强被说「不像女孩」——这是规训，不是天性", "媒体、广告、影视持续强化刻板印象，让你以为「本来如此」", "打破它不是「反传统」，是还给每个人做自己的自由"]}, {"h": "深入：有毒男子气概", "body": "「男生不能哭」「用拳头解决问题」「男人就要多睡几个女人」——这些被称为「有毒男子气概」，它伤害男生自己，也伤害周围人：", "list": ["压抑情绪导致男性抑郁被严重低估，自杀率男性是女性 2 倍多", "用暴力解决冲突是校园霸凌、家暴的根源之一", "把性当征服不尊重伴侣，自己也无法建立真亲密关系", "拒绝求助，有问题硬扛，小问题拖成大问题"], "tipLabel": "重新定义", "tip": "真正的强大是能哭、能示弱、能求助、能尊重别人。把情绪憋死不是坚强，是慢性自杀。"}, {"h": "深入：LGBT+ 不是「潮流」，是科学", "body": "性取向和性别认同的科学共识：", "list": ["性取向不是选择——同性恋、双性恋是自然的性取向变异，不是病，不是「被带坏」", "世界卫生组织 1990 年将同性恋从疾病名录删除，中国 2001 年跟进", "性别认同（觉得自己是男是女）跟生理性别不一致，叫跨性别，也是自然的，不是精神病", "「治疗」性取向或性别认同的「扭转治疗」被国际医学界认定为有害且无效", "LGBT+ 群体面临的歧视、霸凌、自杀率远高于平均，是社会的责任，不是他们的错"], "tipLabel": "你能做的", "tip": "不嘲笑、不传播歧视言论、不参与霸凌。如果你有同学正在经历这些，至少做到不站在加害者一边。"}, {"h": "深入：交叉性歧视", "body": "歧视不会单独出现。一个农村来的、胖的、戴眼镜的、发育晚的男同学，可能同时承受多重嘲笑。理解这一点，是为了不把别人的处境简化成「他活该」或「他自己有问题」。"}, {"h": "深入：旁观者效应——为什么大家都不出手", "body": "心理学经典实验：在场的人越多，每个人出手帮忙的概率越低——因为责任被分散了。这就是为什么校园霸凌发生时，几十个人看着没人管。", "list": ["打破旁观者效应的最简单方法：明确指一个人——「穿红衣服的同学，去叫老师」", "即使不敢直接出手，告诉老师、告诉爸妈、匿名举报——都是行动", "沉默就是帮施害者。你今天沉默，明天被欺凌的可能就是你"]}, {"h": "深入：言语暴力也是暴力", "list": ["「娘炮」「男人婆」「基佬」——这些不是玩笑，是侮辱", "起外 <script>

    '<div class="module-title">第' + (idx+1) + '课：' + m.title + '</div>' +
    '<div class="module-subtitle">' + m.subtitle + '</div>';
  m.sections.forEach(s => {
    html += '<div class="section"><h3>' + s.h + '</h3>';
    if (s.body) html += '<p>' + s.body + '</p>';
    if (s.svg) html += '<div class="diagram">' + s.svg + '</div>';
    if (s.list) { html += '<ul>'; s.list.forEach(li => { html += '<li>' + li + '</li>'; }); html += '</ul>'; }
    if (s.tipLabel) { html += '<div class="tip-box"><div class="tip-label">' + s.tipLabel + '</div><p>' + s.tip + '</p></div>'; }
    html += '</div>';
  });
  html += '<div class="quiz-section"><h3>\uD83E\uDDEA 小测验</h3>';
  m.quizzes.forEach((q, qi) => {
    html += '<div class="quiz-item" id="quiz-' + idx + '-' + qi + '">';
    html += '<div class="quiz-q">' + (qi+1) + '. ' + q.q + '</div>';
    html += '<div class="quiz-options">';
    q.opts.forEach((opt, oi) => { html += '<button class="quiz-opt" onclick="checkAnswer(' + idx + ',' + qi + ',' + oi + ')">' + opt + '</button>'; });
    html += '</div><div class="quiz-feedback" id="fb-' + idx + '-' + qi + '"></div></div>';
  });
  html += '</div>';
  view.innerHTML = html;
  home.style.display = 'none';
  view.style.display = 'block';
  window.scrollTo(0, 0);
  if (!fromHistory) {
    history.pushState({ view: 'module', idx: idx }, '', '#m' + idx);
  }
}

function checkAnswer(moduleIdx, quizIdx, optIdx) {
  const q = MODULES[moduleIdx].quizzes[quizIdx];
  const item = document.getElementById('quiz-' + moduleIdx + '-' + quizIdx);
  const opts = item.querySelectorAll('.quiz-opt');
  const fb = document.getElementById('fb-' + moduleIdx + '-' + quizIdx);
  opts.forEach(o => o.classList.add('disabled'));
  if (optIdx === q.answer) {
    opts[optIdx].classList.add('correct');
    fb.className = 'quiz-feedback good show';
    fb.textContent = '\u2713 ' + q.feedback;
  } else {
    opts[optIdx].classList.add('wrong');
    opts[q.answer].classList.add('correct');
    fb.className = 'quiz-feedback bad show';
    fb.textContent = '\u2717 不对哦。' + q.feedback;
  }
}

function goHome() {
  if (history.state && history.state.view === 'module') {
    history.back();
  } else {
    showHome();
  }
}

function showHome() {
  document.getElementById('moduleView').style.display = 'none';
  document.getElementById('homeView').style.display = 'block';
  currentModule = null;
  renderHome();
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', function(e) {
  if (e.state && e.state.view === 'module') {
    openModule(e.state.idx, true);
  } else {
    showHome();
  }
});

renderHome();
</script>
</body>
</html>
